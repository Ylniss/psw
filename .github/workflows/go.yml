name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Extract Version
        id: get_version
        run: |
          version=$(cat VERSION)
          echo "version=${version}" >> $GITHUB_ENV

      - name: Build Applications
        run: |
          make build

      - name: Run Tests
        run: |
          make test

      - name: Generate SHA256 Checksums
        run: |
          cd ./bin
          sha256sum psw clipclean > checksums.txt

      - name: Archive Binaries
        env:
          VERSION: ${{ env.version }}
        run: |
          tar -czvf ./bin/psw-${VERSION}.tar.gz -C ./bin psw clipclean pswcfg.toml
          rm ./bin/psw ./bin/clipclean ./bin/*.toml

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.version }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --title "Release $VERSION" \
              --notes "Package of psw and clipclean binaries."
          fi

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.version }}
        run: |
          for asset in ./bin/*; do
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$VERSION" "$asset" --clobber; then
                uploaded=true
                break
              fi
              echo "Upload of $asset failed (attempt $attempt/3); retrying in 5s..."
              sleep 5
            done
            if [ "$uploaded" = false ]; then
              echo "Upload of $asset failed after 3 attempts" >&2
              exit 1
            fi
          done
